<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago flix - Expandido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }

        header {
            background: #111;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { font-size: 1.8rem; font-weight: bold; color: #e50914; }

        .search-box {
            background: #222;
            border: 1px solid #444;
            border-radius: 25px;
            padding: 0.5rem 1rem;
            color: #fff;
            width: 300px;
            max-width: 100%;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .tab {
            background: none;
            border: none;
            color: #ccc;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .tab.active, .tab:hover {
            background: #e50914;
            color: #fff;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .content-section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 1rem;
            justify-content: space-between;
        }

        .section-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .language-selector, .year-selector, .genre-selector {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .load-more-btn {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }

        .load-more-btn:hover {
            background: #d40913;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
        }

        .card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #e50914;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-content {
            padding: 0.8rem;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.4em;
        }

        .card-info {
            font-size: 0.75rem;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            background: #e50914;
            padding: 0.2rem 0.4rem;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .quality-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #28a745;
            color: #fff;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .language-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #007bff;
            color: #fff;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.65rem;
        }

        .categories {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .category-btn {
            background: #333;
            border: none;
            color: #ccc;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .category-btn.active, .category-btn:hover {
            background: #e50914;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #ccc;
        }

        .stats {
            background: #222;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            text-align: center;
        }

        .stat-item {
            padding: 0.5rem;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e50914;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #ccc;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.8);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
        }

        .video-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 5;
        }

        .control-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .control-label {
            color: #ccc;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .source-btn, .quality-btn, .lang-btn {
            background: rgba(229, 9, 20, 0.8);
            border: none;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }

        .source-btn:hover, .quality-btn:hover, .lang-btn:hover,
        .source-btn.active, .quality-btn.active, .lang-btn.active {
            background: #e50914;
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .modal-overview {
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 1rem;
        }

        .modal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .detail-item {
            background: #222;
            padding: 1rem;
            border-radius: 5px;
        }

        .detail-label {
            font-weight: bold;
            color: #e50914;
            margin-bottom: 0.5rem;
        }

        .seasons-selector {
            margin: 1rem 0;
        }

        .season-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            margin: 0.2rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .season-btn.active {
            background: #e50914;
        }

        .episodes-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .episode-item {
            background: #222;
            padding: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .episode-item:hover {
            background: #333;
        }

        .error-message {
            text-align: center;
            color: #999;
            padding: 2rem;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .search-box {
                width: 100%;
            }
            
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            
            main {
                padding: 1rem;
            }

            .video-container {
                height: 300px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">Buchecha de Bolachão Fofo Flix</div>
            <input type="text" class="search-box" placeholder="Buscar em milhares de títulos..." id="searchInput">
            <div class="tabs">
                <button class="tab active" data-type="movie">Filmes</button>
                <button class="tab" data-type="tv">Séries</button>
                <button class="tab" data-type="trending">Em Alta</button>
                <button class="tab" data-type="discover">Descobrir</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Estatísticas -->
        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalContent">0</div>
                <div class="stat-label">Total Carregado</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="currentPage">1</div>
                <div class="stat-label">Página Atual</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="availablePages">∞</div>
                <div class="stat-label">Páginas Disponíveis</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="currentCategory">Popular</div>
                <div class="stat-label">Categoria</div>
            </div>
        </div>

        <!-- Controles principais -->
        <div class="section-title">
            <span>Catálogo Expandido</span>
            <div class="section-controls">
                <select class="language-selector" id="languageSelector">
                    <option value="pt-BR">🇧🇷 Português</option>
                    <option value="en-US">🇺🇸 English</option>
                    <option value="es-ES">🇪🇸 Español</option>
                    <option value="fr-FR">🇫🇷 Français</option>
                    <option value="de-DE">🇩🇪 Deutsch</option>
                    <option value="it-IT">🇮🇹 Italiano</option>
                </select>
                <select class="year-selector" id="yearSelector">
                    <option value="">Todos os Anos</option>
                </select>
                <select class="genre-selector" id="genreSelector">
                    <option value="">Todos os Gêneros</option>
                </select>
                <button class="load-more-btn" onclick="loadMoreContent()">Carregar Mais</button>
            </div>
        </div>

        <!-- Categorias expandidas -->
        <div class="categories" id="categories">
            <button class="category-btn active" data-category="popular">Populares</button>
            <button class="category-btn" data-category="top_rated">Mais Avaliados</button>
            <button class="category-btn" data-category="now_playing">Em Cartaz</button>
            <button class="category-btn" data-category="upcoming">Em Breve</button>
            <button class="category-btn" data-category="trending/day">Trending Hoje</button>
            <button class="category-btn" data-category="trending/week">Trending Semana</button>
        </div>

        <!-- Grade de conteúdo -->
        <div class="content-section">
            <div class="grid" id="contentGrid"></div>
            <div class="loading" id="loading">Carregando...</div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="video-container" id="videoContainer">
                <iframe class="video-frame" id="videoFrame" allowfullscreen></iframe>
                <div class="video-controls" id="videoControls">
                    <div class="control-group">
                        <span class="control-label">Servidor:</span>
                        <div id="videoSources"></div>
                    </div>
                    <div class="control-group">
                        <span class="control-label">Qualidade:</span>
                        <div id="qualityOptions"></div>
                    </div>
                    <div class="control-group">
                        <span class="control-label">Idioma:</span>
                        <div id="languageOptions"></div>
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="seasons-selector" id="seasonsSelector" style="display: none;"></div>
                <div class="episodes-list" id="episodesList" style="display: none;"></div>
                <p class="modal-overview" id="modalOverview"></p>
                <div class="modal-details" id="modalDetails"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '8265bd1679663a7ea12ac168da84d2e8';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        // Fontes de streaming expandidas
        const STREAMING_SOURCES = {
            superflix: {
                name: 'SuperFlix',
                movie: (id) => `https://superflix.me/embed/movie/${id}`,
                tv: (id, s, e) => `https://superflix.me/embed/tv/${id}/${s}/${e}`
            },
            vidsrc: {
                name: 'VidSrc',
                movie: (id) => `https://vidsrc.me/embed/movie/${id}`,
                tv: (id, s, e) => `https://vidsrc.me/embed/tv/${id}/${s}/${e}`
            },
            embedsu: {
                name: 'EmbedSU',
                movie: (id) => `https://embed.su/embed/movie/${id}`,
                tv: (id, s, e) => `https://embed.su/embed/tv/${id}/${s}/${e}`
            },
            warezcdn: {
                name: 'WarezCDN',
                movie: (id) => `https://embed.warezcdn.link/filme/${id}`,
                tv: (id, s, e) => `https://embed.warezcdn.link/serie/${id}/${s}/${e}`
            },
            brasilflix: {
                name: 'BrasilFlix',
                movie: (id) => `https://brasilflix.tv/embed/movie/${id}`,
                tv: (id, s, e) => `https://brasilflix.tv/embed/tv/${id}/${s}/${e}`
            },
            filmesflix: {
                name: 'FilmesFlix',
                movie: (id) => `https://filmesflix.io/embed/movie/${id}`,
                tv: (id, s, e) => `https://filmesflix.io/embed/tv/${id}/${s}/${e}`
            }
        };

        // Estado da aplicação
        let currentType = 'movie';
        let currentPage = 1;
        let maxPages = 500;
        let currentItem = null;
        let currentSeason = 1;
        let currentLanguage = 'pt-BR';
        let currentCategory = 'popular';
        let currentYear = '';
        let currentGenre = '';
        let allContent = [];
        let genres = {};
        let isLoading = false; // Flag para controlar carregamento

        const grid = document.getElementById('contentGrid');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('searchInput');
        const languageSelector = document.getElementById('languageSelector');
        const yearSelector = document.getElementById('yearSelector');
        const genreSelector = document.getElementById('genreSelector');

        // Inicialização
        async function init() {
            await loadGenres();
            populateYearSelector();
            loadContent();
            setupEventListeners();
        }

        // Configurar event listeners
        function setupEventListeners() {
            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentType = tab.dataset.type;
                    currentPage = 1;
                    updateGenreSelector();
                    loadContent();
                });
            });

            // Categorias
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    currentPage = 1;
                    loadContent();
                });
            });

            // Busca
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentPage = 1;
                    loadContent();
                }, 500);
            });

            // Seletores
            languageSelector.addEventListener('change', (e) => {
                currentLanguage = e.target.value;
                currentPage = 1;
                loadGenres().then(() => loadContent());
            });

            yearSelector.addEventListener('change', (e) => {
                currentYear = e.target.value;
                currentPage = 1;
                loadContent();
            });

            genreSelector.addEventListener('change', (e) => {
                currentGenre = e.target.value;
                currentPage = 1;
                loadContent();
            });
        }

        // Carregar gêneros da API
        async function loadGenres() {
            try {
                const [movieGenres, tvGenres] = await Promise.all([
                    fetch(`${BASE_URL}/genre/movie/list?api_key=${API_KEY}&language=${currentLanguage}`).then(r => r.json()),
                    fetch(`${BASE_URL}/genre/tv/list?api_key=${API_KEY}&language=${currentLanguage}`).then(r => r.json())
                ]);

                genres.movie = movieGenres.genres || [];
                genres.tv = tvGenres.genres || [];
                
                updateGenreSelector();
            } catch (error) {
                console.error('Erro ao carregar gêneros:', error);
            }
        }

        // Atualizar seletor de gêneros
        function updateGenreSelector() {
            const currentGenres = genres[currentType] || [];
            genreSelector.innerHTML = '<option value="">Todos os Gêneros</option>' +
                currentGenres.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        }

        // Popular seletor de anos
        function populateYearSelector() {
            const currentYear = new Date().getFullYear();
            let years = '<option value="">Todos os Anos</option>';
            
            for (let year = currentYear; year >= 1900; year--) {
                years += `<option value="${year}">${year}</option>`;
            }
            
            yearSelector.innerHTML = years;
        }

        // Fetch data com parâmetros expandidos
        async function fetchData(endpoint, params = {}) {
            try {
                const urlParams = new URLSearchParams({
                    api_key: API_KEY,
                    language: currentLanguage,
                    page: currentPage,
                    ...params
                });

                if (currentYear && !endpoint.includes('search')) {
                    if (currentType === 'movie' || endpoint.includes('movie')) {
                        urlParams.append('year', currentYear);
                    } else {
                        urlParams.append('first_air_date_year', currentYear);
                    }
                }

                if (currentGenre && !endpoint.includes('search')) {
                    urlParams.append('with_genres', currentGenre);
                }

                const url = `${BASE_URL}${endpoint}?${urlParams}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.total_pages) {
                    maxPages = Math.min(data.total_pages, 500);
                    document.getElementById('availablePages').textContent = maxPages;
                }
                
                return data;
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
                // Exibe o erro na interface para diagnóstico
                grid.innerHTML = `<p class="error-message">Erro ao buscar dados da API: ${error.message}. Verifique o console para mais detalhes.</p>`;
                loading.style.display = "none"; 
                return { results: [] };
            }
        }

        function getQualityBadge(rating) {
            if (rating >= 8) return 'HD+';
            if (rating >= 6) return 'HD';
            return 'SD';
        }

        function getLanguageBadge(lang, originalLang) {
            if (lang === 'pt-BR') return 'DUB/LEG';
            if (originalLang === 'pt') return 'BR';
            return 'LEG';
        }

        function createCard(item) {
            const title = item.title || item.name;
            const date = item.release_date || item.first_air_date;
            const year = date ? new Date(date).getFullYear() : 'N/A';
            const rating = item.vote_average || 0;
            const type = item.title ? 'movie' : 'tv';
            
            return `
                <div class="card" onclick="playContent(${item.id}, '${type}')">
                    <img src="${item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/300x450/333/fff?text=Sem+Imagem'}" alt="${title}" loading="lazy">
                    <div class="quality-badge">${getQualityBadge(rating)}</div>
                    <div class="language-badge">${getLanguageBadge(currentLanguage, item.original_language)}</div>
                    <div class="play-overlay">
                        <button class="play-btn">▶</button>
                    </div>
                    <div class="card-content">
                        <div class="card-title">${title}</div>
                        <div class="card-info">
                            <span>${year}</span>
                            <span class="rating">${rating.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Carregar conteúdo
        async function loadContent(append = false) {
            if (isLoading) return; // Evita carregamentos múltiplos
            isLoading = true;
            loading.style.display = 'block';
            
            if (!append) {
                grid.innerHTML = '';
                allContent = [];
                currentPage = 1;
                window.scrollTo(0, 0); // Volta ao topo ao carregar novo conteúdo
            }
            
            try {
                let data = null;
                const query = searchInput.value.trim();

                if (query) {
                    data = await fetchData(`/search/multi`, {
                        query: query
                    });
                } else if (currentType === 'trending') {
                    data = await fetchData('/trending/all/day'); // Pode ser ajustado para week se necessário
                } else if (currentType === 'discover') {
                    // Discover pode ter filtros adicionais, mas vamos manter simples por agora
                    data = await fetchData(`/discover/${currentType === 'movie' ? 'movie' : 'tv'}`); 
                } else {
                    let endpoint = `/${currentType}/${currentCategory}`;
                    if (currentCategory.startsWith('trending/')) {
                        endpoint = `/${currentCategory}`;
                    }
                    data = await fetchData(endpoint);
                }
                
                if (data && data.results && data.results.length > 0) {
                    const newContent = data.results.filter(item => 
                        item.poster_path && (item.title || item.name) && 
                        (item.media_type !== 'person') // Filtra pessoas nos resultados de busca multi
                    );
                    
                    allContent = append ? [...allContent, ...newContent] : newContent;
                    
                    if (append) {
                        grid.innerHTML += newContent.map(createCard).join('');
                    } else {
                        grid.innerHTML = allContent.map(createCard).join('');
                    }
                    
                    updateStats();
                } else {
                    if (!append) {
                        grid.innerHTML = '<p class="error-message">Nenhum conteúdo encontrado para os filtros selecionados.</p>';
                    }
                    // Se append e não há mais resultados, não faz nada ou mostra uma mensagem
                }
            } catch (error) {
                console.error('Erro ao carregar conteúdo:', error);
                grid.innerHTML = '<p class="error-message">Erro ao carregar conteúdo. Tente novamente mais tarde.</p>';
            } finally {
                loading.style.display = 'none';
                isLoading = false;
            }
        }

        // Carregar mais conteúdo
        async function loadMoreContent() {
            if (isLoading || currentPage >= maxPages) return; // Não carrega se já estiver carregando ou se chegou ao fim

            currentPage++;
            document.getElementById("currentPage").textContent = currentPage;
            await loadContent(true); // Chama loadContent com append = true
        }

        // Atualizar estatísticas
        function updateStats() {
            document.getElementById('totalContent').textContent = allContent.length;
            document.getElementById('currentPage').textContent = currentPage;
            
            // Atualiza o nome da categoria exibido
            const categoryElement = document.querySelector(`.category-btn[data-category="${currentCategory}"]`);
            const categoryName = categoryElement ? categoryElement.textContent : 
                                (currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1).replace('_', ' '));
            document.getElementById('currentCategory').textContent = categoryName;
        }

        // Auto-carregamento ao fazer scroll (Scroll Infinito)
        let isFetchingMore = false; // Renomeado de autoLoadEnabled para clareza
        let scrollTimeout; // Para debounce
        function handleScroll() {
            if (isFetchingMore || isLoading) return; // Não carrega se já estiver buscando mais ou carregando inicialmente

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
                // Carrega mais quando estiver perto do final (ex: 1000px antes)
                if (scrollTop + clientHeight >= scrollHeight - 1000) {
                    if (currentPage < maxPages) {
                        isFetchingMore = true;
                        loadMoreContent().finally(() => {
                            // Adiciona um pequeno delay antes de permitir novo carregamento por scroll
                            setTimeout(() => { isFetchingMore = false; }, 500); 
                        });
                    }
                }
            }, 150); // Debounce de 150ms para evitar chamadas excessivas
        }

        window.addEventListener('scroll', handleScroll);

        // Função para abrir o modal e reproduzir o conteúdo
        async function playContent(id, type) {
            try {
                // Buscar detalhes do conteúdo
                const details = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=${currentLanguage}&append_to_response=credits,videos,images`)
                    .then(res => res.json());
                
                currentItem = details;
                
                // Atualizar título e descrição
                document.getElementById('modalTitle').textContent = details.title || details.name;
                document.getElementById('modalOverview').textContent = details.overview || 'Sem descrição disponível.';
                
                // Limpar e preencher detalhes
                const detailsContainer = document.getElementById('modalDetails');
                detailsContainer.innerHTML = '';
                
                // Adicionar detalhes básicos
                const releaseDate = details.release_date || details.first_air_date;
                const year = releaseDate ? new Date(releaseDate).getFullYear() : 'N/A';
                const runtime = details.runtime ? `${details.runtime} min` : (details.episode_run_time && details.episode_run_time.length > 0 ? `${details.episode_run_time[0]} min/ep` : 'N/A');
                const genres = details.genres ? details.genres.map(g => g.name).join(', ') : 'N/A';
                const rating = details.vote_average ? `${details.vote_average.toFixed(1)}/10` : 'N/A';
                
                // Adicionar detalhes ao container
                detailsContainer.innerHTML += `
                    <div class="detail-item">
                        <div class="detail-label">Ano</div>
                        <div>${year}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Duração</div>
                        <div>${runtime}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Gêneros</div>
                        <div>${genres}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Avaliação</div>
                        <div>${rating}</div>
                    </div>
                `;
                
                // Configurar fontes de streaming
                setupStreamingSources(id, type);
                
                // Se for série, carregar temporadas
                if (type === 'tv') {
                    await loadSeasons(id);
                } else {
                    // Se for filme, esconder seletores de temporada e episódios
                    document.getElementById('seasonsSelector').style.display = 'none';
                    document.getElementById('episodesList').style.display = 'none';
                }
                
                // Exibir o modal
                document.getElementById('modal').style.display = 'block';
                
            } catch (error) {
                console.error('Erro ao carregar detalhes:', error);
                alert('Erro ao carregar o conteúdo. Tente novamente mais tarde.');
            }
        }
        
        // Configurar fontes de streaming
        function setupStreamingSources(id, type) {
            const sourcesContainer = document.getElementById('videoSources');
            const qualityContainer = document.getElementById('qualityOptions');
            const languageContainer = document.getElementById('languageOptions');
            
            // Limpar containers
            sourcesContainer.innerHTML = '';
            qualityContainer.innerHTML = '';
            languageContainer.innerHTML = '';
            
            // Adicionar fontes de streaming
            Object.keys(STREAMING_SOURCES).forEach((source, index) => {
                const sourceBtn = document.createElement('button');
                sourceBtn.className = index === 0 ? 'source-btn active' : 'source-btn';
                sourceBtn.textContent = STREAMING_SOURCES[source].name;
                sourceBtn.onclick = () => changeStreamSource(source, id, type);
                sourcesContainer.appendChild(sourceBtn);
            });
            
            // Adicionar opções de qualidade
            const qualities = ['Auto', 'HD', 'SD'];
            qualities.forEach((quality, index) => {
                const qualityBtn = document.createElement('button');
                qualityBtn.className = index === 0 ? 'quality-btn active' : 'quality-btn';
                qualityBtn.textContent = quality;
                qualityBtn.onclick = () => {
                    document.querySelectorAll('.quality-btn').forEach(btn => btn.classList.remove('active'));
                    qualityBtn.classList.add('active');
                    // Aqui você pode implementar a lógica para mudar a qualidade
                };
                qualityContainer.appendChild(qualityBtn);
            });
            
            // Adicionar opções de idioma
            const languages = ['Dublado', 'Legendado', 'Original'];
            languages.forEach((lang, index) => {
                const langBtn = document.createElement('button');
                langBtn.className = index === 0 ? 'lang-btn active' : 'lang-btn';
                langBtn.textContent = lang;
                langBtn.onclick = () => {
                    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                    langBtn.classList.add('active');
                    // Aqui você pode implementar a lógica para mudar o idioma
                };
                languageContainer.appendChild(langBtn);
            });
            
            // Carregar a primeira fonte por padrão
            changeStreamSource(Object.keys(STREAMING_SOURCES)[0], id, type);
        }
        
        // Mudar fonte de streaming
        function changeStreamSource(source, id, type, season = 1, episode = 1) {
            // Atualizar botões ativos
            document.querySelectorAll('.source-btn').forEach(btn => {
                if (btn.textContent === STREAMING_SOURCES[source].name) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Obter URL da fonte
            let streamUrl;
            if (type === 'movie') {
                streamUrl = STREAMING_SOURCES[source].movie(id);
            } else {
                streamUrl = STREAMING_SOURCES[source].tv(id, season, episode);
            }
            
            // Atualizar iframe
            document.getElementById('videoFrame').src = streamUrl;
        }
        
        // Carregar temporadas para séries
        async function loadSeasons(id) {
            try {
                // Buscar detalhes da série
                const details = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=${currentLanguage}`)
                    .then(res => res.json());
                
                if (details.seasons && details.seasons.length > 0) {
                    const seasonsContainer = document.getElementById('seasonsSelector');
                    seasonsContainer.innerHTML = '<div style="margin-bottom: 10px; font-weight: bold;">Temporadas:</div>';
                    
                    // Filtrar temporadas válidas (algumas APIs incluem temporadas especiais)
                    const validSeasons = details.seasons.filter(s => s.season_number > 0);
                    
                    // Adicionar botões para cada temporada
                    validSeasons.forEach(season => {
                        const seasonBtn = document.createElement('button');
                        seasonBtn.className = season.season_number === 1 ? 'season-btn active' : 'season-btn';
                        seasonBtn.textContent = `Temporada ${season.season_number}`;
                        seasonBtn.onclick = () => loadEpisodes(id, season.season_number);
                        seasonsContainer.appendChild(seasonBtn);
                    });
                    
                    // Exibir seletor de temporadas
                    seasonsContainer.style.display = 'block';
                    
                    // Carregar episódios da primeira temporada por padrão
                    if (validSeasons.length > 0) {
                        await loadEpisodes(id, validSeasons[0].season_number);
                    }
                } else {
                    // Se não houver temporadas, esconder seletores
                    document.getElementById('seasonsSelector').style.display = 'none';
                    document.getElementById('episodesList').style.display = 'none';
                }
            } catch (error) {
                console.error('Erro ao carregar temporadas:', error);
                document.getElementById('seasonsSelector').innerHTML = '<p class="error-message">Erro ao carregar temporadas.</p>';
            }
        }
        
        // Carregar episódios de uma temporada
        async function loadEpisodes(id, seasonNumber) {
            try {
                // Atualizar botões ativos
                document.querySelectorAll('.season-btn').forEach(btn => {
                    if (btn.textContent === `Temporada ${seasonNumber}`) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                
                // Atualizar temporada atual
                currentSeason = seasonNumber;
                
                // Buscar episódios da temporada
                const seasonDetails = await fetch(`${BASE_URL}/tv/${id}/season/${seasonNumber}?api_key=${API_KEY}&language=${currentLanguage}`)
                    .then(res => res.json());
                
                const episodesContainer = document.getElementById('episodesList');
                
                if (seasonDetails.episodes && seasonDetails.episodes.length > 0) {
                    episodesContainer.innerHTML = '';
                    
                    // Adicionar cada episódio
                    seasonDetails.episodes.forEach(episode => {
                        const episodeItem = document.createElement('div');
                        episodeItem.className = 'episode-item';
                        episodeItem.innerHTML = `
                            <div style="font-weight: bold;">E${episode.episode_number}: ${episode.name}</div>
                            <div style="font-size: 0.8rem; color: #ccc; margin-top: 5px;">${episode.overview ? episode.overview.substring(0, 100) + '...' : 'Sem descrição disponível.'}</div>
                        `;
                        episodeItem.onclick = () => {
                            // Obter fonte ativa
                            const activeSource = document.querySelector('.source-btn.active').textContent;
                            const sourceKey = Object.keys(STREAMING_SOURCES).find(key => 
                                STREAMING_SOURCES[key].name === activeSource
                            );
                            
                            // Mudar para o episódio selecionado
                            changeStreamSource(sourceKey, id, 'tv', seasonNumber, episode.episode_number);
                        };
                        episodesContainer.appendChild(episodeItem);
                    });
                    
                    // Exibir lista de episódios
                    episodesContainer.style.display = 'grid';
                } else {
                    episodesContainer.innerHTML = '<p class="error-message">Nenhum episódio encontrado para esta temporada.</p>';
                    episodesContainer.style.display = 'block';
                }
            } catch (error) {
                console.error('Erro ao carregar episódios:', error);
                document.getElementById('episodesList').innerHTML = '<p class="error-message">Erro ao carregar episódios.</p>';
                document.getElementById('episodesList').style.display = 'block';
            }
        }
        
        // Fechar o modal
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('videoFrame').src = '';
        }

        // Inicializa a aplicação
        init();
    </script>
